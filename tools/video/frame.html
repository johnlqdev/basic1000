<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Basic 1000 film frame</title>
<!-- One frame of a grammar film, for tools/video/render.py. It loads the site's own player
     (films.js, figures.js), data (grammar-data.js) and styles (the <style> of index.html), so a
     recorded film looks exactly like the film on the site. Not part of the website. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Libre+Caslon+Display&display=swap">
<style id="site"></style>
<style>
  html, body { margin: 0; background: var(--paper); }
  #frame { position: relative; box-sizing: border-box; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--body);
    display: flex; flex-direction: column; }
  .v-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .v-eyebrow { font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .v-title { font-family: var(--display); font-weight: 400; margin: 6px 0 0; line-height: 1.1; }
  .v-logo { flex: none; display: block; }
  .v-main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .film-screen { box-shadow: var(--shadow); }
  .v-sub { font-family: var(--display); text-align: center; line-height: 1.4; margin: 0; display: flex; align-items: center; justify-content: center; }
  /* one inner block, so a long line wraps as one paragraph (as flex items, the text and each marked
     word wrapped on their own) */
  .v-sub-in { display: block; max-width: 100%; text-wrap: balance; }
  .v-sub .nw { white-space: nowrap; } /* a quoted word or phrase (“does not”) stays on one line */
  .v-sub mark { -webkit-box-decoration-break: clone; box-decoration-break: clone; background: var(--marker); color: var(--ink); border-radius: 6px; padding: 0 .12em; }
  /* a line a person in the film says: quote marks, as .film-quote on the site (not .q, the site's quiz card) */
  .v-sub .v-q::before { content: "\201C"; color: var(--muted); } .v-sub .v-q::after { content: "\201D"; color: var(--muted); }
  .v-segs { display: flex; gap: 8px; }
  .v-seg { flex: 1; height: 6px; border-radius: 999px; background: var(--rule); position: relative; overflow: hidden; }
  .v-seg i { position: absolute; inset: 0 auto 0 0; background: var(--tab); border-radius: 999px; }
  .v-seg.cur { background: color-mix(in srgb, var(--tab) 25%, var(--rule)); }

  /* desktop: 1280 x 720 CSS px (recorded at 1.5x = 1920 x 1080) */
  .L-desktop { width: 1280px; height: 720px; padding: 30px 48px 30px; }
  .L-desktop .v-eyebrow { font-size: 13px; }
  .L-desktop .v-title { font-size: 30px; }
  .L-desktop .v-logo { height: 34px; }
  .L-desktop .v-main { flex-direction: column; align-items: center; gap: 14px; }
  .L-desktop .film-screen { width: 800px; }
  .L-desktop .v-sub { width: 1100px; height: 96px; font-size: 31px; }
  .L-desktop .v-segs { width: 800px; margin: 0 auto; }

  /* phone: 720 x 1280 CSS px (recorded at 1.5x = 1080 x 1920) */
  .L-phone { width: 720px; height: 1280px; padding: 56px 40px 64px; }
  .L-phone .v-eyebrow { font-size: 15px; }
  .L-phone .v-title { font-size: 40px; }
  .L-phone .v-logo { height: 38px; margin-top: 2px; }
  .L-phone .v-main { gap: 34px; padding-bottom: 40px; }
  .L-phone .film-screen { width: 640px; }
  .L-phone .v-sub { height: 220px; font-size: 42px; padding: 0 6px; }
  .L-phone .v-segs { margin-top: 8px; }
</style>
</head>
<body>
<div id="frame"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="/figures.js"></script>
<script src="/films.js"></script>
<script src="/grammar-data.js"></script>
<script>
// The Basic 1000 logo: a teal tile with a serif "B" over a marker-yellow bar (the highlight colour of
// the site's key words), and the wordmark in the site's display face.
var LOGO = '<svg class="v-logo" viewBox="0 0 168 40" role="img" aria-label="Basic 1000">' +
  '<rect x="0" y="0" width="40" height="40" rx="10" fill="#0e6e6a"/>' +
  '<rect x="9" y="29" width="22" height="4" rx="2" fill="#f3d95b"/>' +
  '<text x="20" y="27.5" text-anchor="middle" font-family="Libre Caslon Display, Georgia, serif" font-size="27" fill="#ffffff">B</text>' +
  '<text x="50" y="27" font-family="Libre Caslon Display, Georgia, serif" font-size="23" fill="#17212b">Basic 1000</text></svg>';

var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var D = window.BASIC_GRAMMAR_DATA;
var LEAD = 0.5, GAP = 0.38, TAIL = 0.9; // the player's pauses (films.js playShot): before the first line, after each line, after a shot

// the films in curriculum order: [{id, title, lines: [{t, v}]}]
window.listFilms = function () {
  return D.nodes.filter(function (n) { return D.lessons[n.id] && (D.lessons[n.id].film || []).length; }).map(function (n) {
    return { id: n.id, title: n.title, lines: [].concat.apply([], D.lessons[n.id].film.map(function (s) {
      return (s.lines || []).map(function (l) { return { t: l.t, v: l.v === 'woman' ? 'woman' : 'man' }; });
    })) };
  });
};

// the same timing as the player: durs[s][k] = length of the recording of line k of shot s, in seconds
function timeline(film, durs) {
  var t = 0, shots = film.map(function (shot, s) {
    var start = t, rel = LEAD, starts = [];
    (shot.lines || []).forEach(function (_, k) { starts.push(rel); rel += durs[s][k] + GAP; });
    var held = rel; // every line said (st.line = lines.length)
    rel += Math.max(TAIL, (shot.min || 0) / 1000 - rel);
    t = start + rel;
    return { start: start, end: t, starts: starts, held: held };
  });
  return { shots: shots, total: t };
}

var F = null, last = '';
window.setupFilm = async function (id, layout, number, count, durs) {
  var css = await (await fetch('/index.html')).text();
  document.getElementById('site').textContent = css.slice(css.indexOf('<style>') + 7, css.indexOf('</style>'));
  var node = D.nodes.filter(function (n) { return n.id === id; })[0], film = D.lessons[id].film;
  var el = document.getElementById('frame');
  el.className = 'L-' + layout;
  el.innerHTML = '<div class="v-head"><div><div class="v-eyebrow">Grammar · ' + number + ' of ' + count + '</div>' +
    '<h1 class="v-title">' + esc(node.title) + '</h1></div>' + LOGO + '</div>' +
    '<div class="v-main"><div class="film"><div class="film-screen"><svg class="film-svg" viewBox="0 0 320 180"><g class="film-scene"></g></svg></div></div>' +
    '<p class="v-sub"></p><div class="v-segs">' + film.map(function () { return '<div class="v-seg"><i></i></div>'; }).join('') + '</div></div>';
  await document.fonts.ready;
  // measure text only after the fonts are in (films.js keeps the widths of board words)
  await Promise.all(['15px "Libre Caslon Display"', '600 9px "Atkinson Hyperlegible"', '700 11px "Atkinson Hyperlegible"'].map(function (f) { return document.fonts.load(f); }));
  F = { film: film, tl: timeline(film, durs), svg: el.querySelector('svg.film-svg'), sub: el.querySelector('.v-sub'), segs: el.querySelectorAll('.v-seg') };
  last = '';
  return { total: F.tl.total, starts: F.tl.shots.map(function (sh) { return sh.starts.map(function (x) { return sh.start + x; }); }) };
};

function subHTML(line) {
  if (!line) return '';
  var hl = (line.hl || []).map(function (w) { return w.toLowerCase(); });
  // a word or phrase in quotes is marked as a whole and kept on one line; elsewhere, the line's own
  // marked words (hl) are marked
  var html = esc(line.t).split(/(“[^”]*”)/).map(function (part) {
    if (/^“[^”]*”$/.test(part)) return '<span class="nw">“<mark>' + part.slice(1, -1) + '</mark>”</span>';
    return part.replace(/[A-Za-z']+/g, function (w) { return hl.indexOf(w.toLowerCase().replace(/[^a-z']/g, '')) >= 0 ? '<mark>' + w + '</mark>' : w; });
  }).join('');
  return '<span class="v-sub-in">' + (line.by ? '<span class="v-q">' + html + '</span>' : html) + '</span>';
}

// a long line gets smaller type until it fits the subtitle box (in as many lines as it needs)
function fitSub() {
  F.sub.style.fontSize = '';
  var inner = F.sub.firstChild, size = parseFloat(getComputedStyle(F.sub).fontSize), min = size * 0.7;
  while (inner && inner.offsetHeight > F.sub.clientHeight && size > min) { size -= 1; F.sub.style.fontSize = size + 'px'; }
}

// every subtitle of every film in a layout, set the way drawFrame sets it: returns how many were
// checked, the most lines one needed, and the ones that needed smaller type or still do not fit
// (render.py stops when any does not fit)
window.checkSubs = async function (layout) {
  var films = listFilms(), out = { checked: 0, maxLines: 0, small: [], over: [] };
  for (var f = 0; f < films.length; f++) {
    var film = D.lessons[films[f].id].film;
    await setupFilm(films[f].id, layout, f + 1, films.length, film.map(function (s) { return (s.lines || []).map(function () { return 1; }); }));
    film.forEach(function (shot) {
      (shot.lines || []).forEach(function (line) {
        F.sub.innerHTML = subHTML(line); fitSub();
        var inner = F.sub.firstChild, lh = parseFloat(getComputedStyle(F.sub).lineHeight);
        var lines = Math.round(inner.offsetHeight / lh);
        out.checked++; out.maxLines = Math.max(out.maxLines, lines);
        if (inner.offsetHeight > F.sub.clientHeight || inner.scrollWidth > F.sub.clientWidth + 1) out.over.push(films[f].id + ': ' + line.t);
        else if (F.sub.style.fontSize) out.small.push(films[f].id + ': ' + line.t);
      });
    });
  }
  return out;
};

// draw the film at time T (seconds); returns true when the picture differs from the last one drawn
window.drawFrame = function (T) {
  var tl = F.tl, s = 0;
  while (s < tl.shots.length - 1 && T >= tl.shots[s].end) s++;
  var sh = tl.shots[s], shot = F.film[s], lines = shot.lines || [], rel = T - sh.start;
  var st = { t: rel * 1000, starts: [], line: -1 };
  sh.starts.forEach(function (x, k) { if (rel >= x) { st.starts[k] = x * 1000; st.line = k; } });
  if (rel >= sh.held) st.line = lines.length;
  BASIC_FILMS.render(F.svg, shot, st);
  // the subtitle is the last line begun (the player keeps it until the next line starts)
  var subLine = null;
  for (var i = s; i >= 0 && !subLine; i--) {
    var r = T - tl.shots[i].start, ls = F.film[i].lines || [];
    for (var k = ls.length - 1; k >= 0; k--) if (r >= tl.shots[i].starts[k]) { subLine = ls[k]; break; }
  }
  var sub = subHTML(subLine);
  if (F.sub.innerHTML !== sub) { F.sub.innerHTML = sub; fitSub(); }
  var bars = [];
  F.segs.forEach(function (b, i) {
    var n = (F.film[i].lines || []).length || 1;
    var k = i < s ? 1 : i > s ? 0 : st.line >= n ? 1 : Math.max(0, (st.line + 0.5) / n);
    b.firstChild.style.width = (k * 100) + '%'; b.classList.toggle('cur', i === s); bars.push(k);
  });
  var sig = F.svg.innerHTML + '|' + sub + '|' + bars.join(',') + '|' + s;
  var changed = sig !== last; last = sig;
  return changed;
};
</script>
</body>
</html>
